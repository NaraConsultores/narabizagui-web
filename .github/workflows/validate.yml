name: Validate NaraFlows
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - name: Verify distributed bundle and web hashes
        run: git diff --exit-code -- manifest.json index.html microsoft-auth.html plugins/naraflows/server/dist/ vendor/
